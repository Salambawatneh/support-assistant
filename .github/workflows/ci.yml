name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t support-assistant .
      - name: Smoke test the container
        run: |
          docker run -d --name sa -p 8000:8000 support-assistant
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs sa
          exit 1
